services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: firefly-api-dev
    env_file:
      - .env.docker.dev 
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - firefly-api-node-modules:/app/node_modules
      - firefly-api-dist:/app/dist
    depends_on:
      mongo:
          condition: service_healthy
      redis: 
        condition: service_healthy
    networks:
      - firefly-network
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
         "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
         ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:8
    container_name: firefly-mongodb-dev
    ports: 
      - "27017:27017"
    volumes:
      - firefly-mongo-data-dev:/data/db
    networks:
      - firefly-network
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL", 
        "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: firefly-redis-dev
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - firefly-redis-data-dev:/data
    networks:
      - firefly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  firefly-network:
    driver: bridge

volumes:
  firefly-api-node-modules:
  firefly-api-dist:
  firefly-mongo-data-dev:
  firefly-redis-data-dev:
