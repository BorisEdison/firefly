services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firefly-api
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
    networks:
      - firefly-network
    retstart: unless-stopped

  mongo:
    image: mongo:8
    container_name: firefly-mongodb
    ports:
      - "27017:27017"
    volumes:
      - firefly-mongo-data:/data/db
    networks:
      - firefly-network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: firefly-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - firefly-redis-data:/data
    networks:
      - firefly-network
    restart: unless-stopped

networks:
  firefly-network:
    driver: bridge

volumes: 
  firefly-mongo-data:
  firefly-redis-data:
